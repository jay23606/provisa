# Copies the images listed in .github/ci-images/*.txt from their upstream registry to this
# repository's registry, ghcr.io/kenstott/provisa/ci-<name>, digest preserved.
#
# The container-backed test stack pulls those copies in CI (tests/ci_images.py) instead of
# Docker Hub: no anonymous pull quota, layers pulled in parallel and stored once, and none of it
# in the repository's 10 GB of Actions cache -- which the lanes' image archives overran, evicting
# each other and every small cache with them (run 38046755990).
#
# It runs when a list or this file changes, weekly (a copy that has gone missing is found before
# a lane finds it), and on demand. A copy that already answers to its digest is not copied again,
# so a repeat run is a check. It reads no repository secret: the run's own token, which this job
# alone may use to write packages.
name: Mirror CI images

on:
  push:
    branches: [main, "ci/**"]
    paths:
      - ".github/ci-images/**"
      - ".github/workflows/mirror-ci-images.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-ci-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  mirror:
    name: Copy images to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      # Every platform of an image is copied (--all), so the copy answers to the SAME digest the
      # list pins -- for a multi-platform image that is its index. A copy is the upstream image
      # or the step fails: it is read back by that digest.
      - name: Copy each image with its digest preserved
        run: |
          set -euo pipefail
          copied=0; present=0
          for list in .github/ci-images/*.txt; do
            while read -r name upstream asked; do
              case "$name" in ''|'#'*) continue ;; esac
              digest="${upstream##*@}"
              target="ghcr.io/kenstott/provisa/ci-${name}"
              if skopeo inspect --raw "docker://${target}@${digest}" > /dev/null 2>&1; then
                present=$((present + 1))
                continue
              fi
              echo "copying ${upstream} (asked for as ${asked}) -> ${target}:mirror"
              skopeo copy --all --preserve-digests "docker://${upstream}" "docker://${target}:mirror"
              skopeo inspect --raw "docker://${target}@${digest}" > /dev/null
              copied=$((copied + 1))
            done < "$list"
          done
          echo "copied ${copied}, already present ${present}"
          echo "copied ${copied}, already present ${present}" >> "$GITHUB_STEP_SUMMARY"

      # The lanes pull without credentials, so every copy must be readable by anyone. A package
      # that is not is named here, each one: its visibility is a repository setting.
      - name: Every copy can be pulled without credentials
        run: |
          set -euo pipefail
          skopeo logout ghcr.io
          private=""
          for list in .github/ci-images/*.txt; do
            while read -r name upstream asked; do
              case "$name" in ''|'#'*) continue ;; esac
              if ! skopeo inspect --raw "docker://ghcr.io/kenstott/provisa/ci-${name}@${upstream##*@}" > /dev/null 2>&1; then
                private="${private} provisa/ci-${name}"
              fi
            done < "$list"
          done
          if [ -n "$private" ]; then
            echo "::error::not readable without credentials (make each package public):${private}"
            {
              echo "### Packages that are not public"
              for package in $private; do echo "- \`${package}\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "every copy is readable without credentials"
