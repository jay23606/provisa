#
# The named demo "sonnets" (start-ui-install.sh --demo sonnets; REQ-2016). This file is its one
# start point: `docker compose up -d` brings up the sonnets' database and an empty vector store.
#
#   postgres  Shakespeare's 154 sonnets, a row a sonnet and a row a line (db/init.sql loads
#             db/lines.tsv), and the empty table the echoes are written to.
#   qdrant    the vector store the lines' embeddings are written to.
#   seeder    creates the empty collection sonnet_lines in Qdrant (seed.py), then exits.
#
# Ports: 28532 the database, 28533 Qdrant; each can be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: sonnets
name: provisa-demo-sonnets
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: rdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sonnets
    ports:
      - "${SONNETS_PG_PORT:-28532}:5432"
    volumes:
      - sonnets_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/lines.tsv:/docker-entrypoint-initdb.d/lines.tsv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sonnets"]
      interval: 2s
      timeout: 5s
      retries: 60
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: vector
    ports:
      - "${SONNETS_QDRANT_PORT:-28533}:6333"
    volumes:
      - sonnets_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
  seeder:
    image: provisa-demo-sonnets-seeder:1
    build:
      context: .
      dockerfile: Dockerfile.seeder
    restart: "no"
    labels:
      <<: *demo-labels
      com.provisa.demo.role: seeder
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  sonnets_pg:
  sonnets_qdrant:
