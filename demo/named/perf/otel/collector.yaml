# The three-device benchmark's collector (device 3, METHODOLOGY.md): Provisa on device 1 exports
# OTLP here; the collector batches and forwards to otlp2sql, which writes the ops tables.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
    timeout: 200ms
exporters:
  otlphttp:
    endpoint: http://otlp2sql:4318
    compression: gzip
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp]
