# The weblogs demo's nginx (REQ-1858, REQ-1996): in front of the shop, it gives every request an
# id ($request_id), passes it to the shop as X-Request-Id and writes it to its access log, one
# JSON object a line. The ids the shop's paths and cookie carry are fields of their own, so the
# log joins the shop's tables without parsing a path.

# The product, order and customer a request is about: a number, or JSON null.
map $uri $product_id {
    ~^/products/(?<id>[0-9]+)$ $id;
    default null;
}
map $uri $order_id {
    ~^/orders/(?<id>[0-9]+)$ $id;
    default null;
}
map $cookie_customer $customer_id {
    ~^[0-9]+$ $cookie_customer;
    default null;
}

log_format shop_json escape=json
    '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
    '"path":"$uri","query":"$args","status":$status,"request_time":$request_time,'
    '"bytes":$body_bytes_sent,"user_agent":"$http_user_agent","request_id":"$request_id",'
    '"customer_id":$customer_id,"product_id":$product_id,"order_id":$order_id}';

server {
    listen 80;
    # The demo's traffic comes from one container; each customer's address is in X-Forwarded-For.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    access_log /var/log/shop/access.json shop_json;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://shop:8000;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }
}
