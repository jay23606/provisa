#
# The WHOLE config of the named demo "weblogs" (start-ui-install.sh --demo weblogs; REQ-1858): a
# web shop's database and the two logs its traffic writes, joined. docker-compose.yml in this
# directory brings the shop up and sends it a fixed run of traffic.
#
#   shop-db       the shop's Postgres: customers, products, orders, order_items. Provisa reads it as
#                 provisa_reader, whose statements the database does not log.
#   shop_access   a Logs source (REQ-1996) over nginx's JSON access log: one row a request, with
#                 the id nginx gave it and the customer, product or order it was about.
#   shop_db_log   a Logs source over the database's jsonlog: one row a statement the shop sent,
#                 with its duration, and one an error. Each statement carries its request's id in a
#                 SQLCommenter comment (/*request_id='…',route='…'*/), and each record in
#                 application_name: the shop opens a connection a request, named by its id.
#
# The globs name the files under PROVISA_NAMED_DEMO_DIR, which start-ui-install.sh sets to this
# directory, adding its logs/ to the directories a Logs source may read.
#
# A request and its statements are joined on application_name, a column of the database log: two
# tables are joined only on their columns, along a relationship (db-log-to-request below). The
# views take the duration and the statement out of a log message with SPLIT_PART, and turn the ''
# a missing delimiter gives into NULL with NULLIF: the one spelling PostgreSQL, DuckDB and Trino
# all run alike, whichever engine the demo starts on.
auth:
  assignments_source: provisa
  default_assignments:
  - domain_id: '*'
    role_id: org_admin
  provider: none
cache:
  default_ttl: 300
  enabled: true
discovery:
  api_key: ${env:ANTHROPIC_API_KEY:-}
  min_confidence: 0.7
  sample_size: 20
domains:
- id: shop
  description: A web shop's database and the logs its traffic writes -- nginx's access log and the
    database's statement log -- joined by the id nginx gives each request
federation_engine: duckdb
naming:
  domain_prefix: true
  rules: []
roles:
- id: analyst
  capabilities:
  - query_development
  domain_access:
  - shop
server:
  limits:
    default_row_limit: 100
    request_timeout: 60
    trino_query_timeout: 120
sources:
- id: shop-db
  type: postgresql
  host: ${env:WEBLOGS_PG_HOST:-localhost}
  port: ${env:WEBLOGS_PG_PORT:-28432}
  database: shop
  username: provisa_reader
  password: provisa_reader
  description: The web shop's database -- customers, products and the orders they place
- id: shop_access
  type: logs
  # Re-read every 30 seconds: what the shop logged since lands as new rows.
  cache_ttl: 30
  description: nginx's access log for the web shop, one JSON object a request
  mapping:
    glob: ${env:PROVISA_NAMED_DEMO_DIR}/logs/nginx/access.json*
    format: jsonl
- id: shop_db_log
  type: logs
  # Re-read every 30 seconds: what the shop logged since lands as new rows.
  cache_ttl: 30
  description: The shop database's log, as jsonlog -- every statement the shop sends with its
    duration, and every error
  mapping:
    glob: ${env:PROVISA_NAMED_DEMO_DIR}/logs/postgres/postgresql-*.json
    format: postgresql_jsonlog
tables:
- source_id: shop-db
  domain_id: shop
  schema: shop
  table: customers
  description: The shop's customers
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The customer's id, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The customer's name, visible_to: [org_admin, analyst]}
  - {name: email, data_type: varchar, description: The customer's email address, visible_to: [org_admin]}
  - {name: city, data_type: varchar, description: Where the customer lives, visible_to: [org_admin, analyst]}
  - {name: joined_on, data_type: date, description: When the customer signed up, visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: shop
  table: products
  description: What the shop sells
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The product's id, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The product's name, visible_to: [org_admin, analyst]}
  - {name: category, data_type: varchar, description: The product's category, visible_to: [org_admin, analyst]}
  - {name: price, data_type: decimal, description: The price in USD, visible_to: [org_admin, analyst]}
  - {name: stock, data_type: integer, description: Units in stock, visible_to: [org_admin, analyst]}
  - {name: description, data_type: varchar, description: The product's description, visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: shop
  table: orders
  description: Orders the shop's customers placed
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The order's id, visible_to: [org_admin, analyst]}
  - {name: customer_id, data_type: integer, description: The customer who placed it, visible_to: [org_admin, analyst]}
  - {name: placed_at, data_type: timestamp, description: When it was placed, visible_to: [org_admin, analyst]}
  - {name: status, data_type: varchar, description: 'placed, paid, shipped, delivered or cancelled', visible_to: [org_admin, analyst]}
- source_id: shop-db
  domain_id: shop
  schema: shop
  table: order_items
  description: The lines of each order
  columns:
  - {name: id, data_type: integer, is_primary_key: true, description: The line's id, visible_to: [org_admin, analyst]}
  - {name: order_id, data_type: integer, description: The order the line is on, visible_to: [org_admin, analyst]}
  - {name: product_id, data_type: integer, description: The product ordered, visible_to: [org_admin, analyst]}
  - {name: quantity, data_type: integer, description: Units ordered, visible_to: [org_admin, analyst]}
  - {name: unit_price, data_type: decimal, description: The price of one unit when ordered, visible_to: [org_admin, analyst]}
- source_id: shop_access
  domain_id: shop
  schema: default
  table: shop_access
  alias: access_log
  description: One row a request nginx served the shop
  columns:
  - {name: _file_id, data_type: varchar, is_primary_key: true, description: The log file's identity, visible_to: [org_admin]}
  - {name: _file_name, data_type: varchar, description: The file the request was read from, visible_to: [org_admin]}
  - {name: _line_offset, data_type: bigint, is_primary_key: true, description: Where in the file the request's line starts, visible_to: [org_admin]}
  - {name: _entry, data_type: bigint, is_primary_key: true, description: The entry of the line, always 0 here, visible_to: [org_admin]}
  - {name: _raw, data_type: varchar, description: The line as nginx wrote it, visible_to: [org_admin]}
  - {name: _parse_error, data_type: varchar, description: Why the line could not be read; empty when it was, visible_to: [org_admin]}
  - {name: time, data_type: timestamp, description: When the request was served, visible_to: [org_admin, analyst]}
  - {name: client, data_type: varchar, description: The client's address, visible_to: [org_admin]}
  - {name: method, data_type: varchar, description: The HTTP method, visible_to: [org_admin, analyst]}
  - {name: path, data_type: varchar, description: The path requested, visible_to: [org_admin, analyst]}
  - {name: query, data_type: varchar, description: The query string, visible_to: [org_admin, analyst]}
  - {name: status, data_type: integer, description: The HTTP status returned, visible_to: [org_admin, analyst]}
  - {name: request_time, data_type: double, description: Seconds nginx took to answer, visible_to: [org_admin, analyst]}
  - {name: bytes, data_type: bigint, description: Bytes of body sent, visible_to: [org_admin, analyst]}
  - {name: user_agent, data_type: varchar, description: The client's user agent, visible_to: [org_admin, analyst]}
  - {name: request_id, data_type: varchar, description: The id nginx gave the request; the shop's statements carry it, visible_to: [org_admin, analyst]}
  - {name: customer_id, data_type: integer, description: The signed-in customer, from the shop's cookie, visible_to: [org_admin, analyst]}
  - {name: product_id, data_type: integer, description: 'The product a /products/{id} request asked for', visible_to: [org_admin, analyst]}
  - {name: order_id, data_type: integer, description: 'The order an /orders/{id} request asked for', visible_to: [org_admin, analyst]}
  - {name: extra, data_type: json, description: Any field the columns above do not hold, visible_to: [org_admin]}
  - {name: _landed_at, data_type: timestamp, description: When the row was read into Provisa, visible_to: [org_admin]}
- source_id: shop_db_log
  domain_id: shop
  schema: default
  table: shop_db_log
  alias: db_log
  description: One row a record of the shop database's log -- a statement with its duration, or an
    error
  columns:
  - {name: _file_id, data_type: varchar, is_primary_key: true, description: The log file's identity, visible_to: [org_admin]}
  - {name: _file_name, data_type: varchar, description: The file the record was read from, visible_to: [org_admin]}
  - {name: _line_offset, data_type: bigint, is_primary_key: true, description: Where in the file the record starts, visible_to: [org_admin]}
  - {name: _entry, data_type: bigint, is_primary_key: true, description: The entry of the record, always 0 here, visible_to: [org_admin]}
  - {name: _raw, data_type: varchar, description: The record as the database wrote it, visible_to: [org_admin]}
  - {name: _parse_error, data_type: varchar, description: Why the record could not be read; empty when it was, visible_to: [org_admin]}
  - {name: timestamp, data_type: timestamp, description: When the database logged it, visible_to: [org_admin, analyst]}
  - {name: user, data_type: varchar, description: The database role, visible_to: [org_admin, analyst]}
  - {name: dbname, data_type: varchar, description: The database, visible_to: [org_admin, analyst]}
  - {name: pid, data_type: integer, description: The server process, visible_to: [org_admin, analyst]}
  - {name: remote_host, data_type: varchar, description: The client's address, visible_to: [org_admin]}
  - {name: session_id, data_type: varchar, description: The session, visible_to: [org_admin, analyst]}
  - {name: line_num, data_type: integer, description: The record's number within its session, visible_to: [org_admin, analyst]}
  - {name: ps, data_type: varchar, description: The command the session was running, visible_to: [org_admin, analyst]}
  - {name: session_start, data_type: timestamp, description: When the session started, visible_to: [org_admin, analyst]}
  - {name: vxid, data_type: varchar, description: The virtual transaction id, visible_to: [org_admin]}
  - {name: txid, data_type: bigint, description: The transaction id, visible_to: [org_admin]}
  - {name: error_severity, data_type: varchar, description: 'LOG for a statement, ERROR for a failure', visible_to: [org_admin, analyst]}
  - {name: state_code, data_type: varchar, description: The SQLSTATE of an error, visible_to: [org_admin, analyst]}
  - {name: message, data_type: varchar, description: 'The message: "duration: N ms  statement: …" for a statement', visible_to: [org_admin, analyst]}
  - {name: detail, data_type: varchar, description: An error's detail, visible_to: [org_admin, analyst]}
  - {name: hint, data_type: varchar, description: An error's hint, visible_to: [org_admin, analyst]}
  - {name: statement, data_type: varchar, description: The statement an error came from, visible_to: [org_admin, analyst]}
  - {name: context, data_type: varchar, description: Where in a function an error came from, visible_to: [org_admin]}
  - {name: application_name, data_type: varchar, description: "The id of the request the shop's connection served", visible_to: [org_admin, analyst]}
  - {name: backend_type, data_type: varchar, description: The kind of server process, visible_to: [org_admin]}
  - {name: query_id, data_type: bigint, description: The query's id, when computed, visible_to: [org_admin]}
  - {name: extra, data_type: json, description: Any field the columns above do not hold, visible_to: [org_admin]}
  - {name: _landed_at, data_type: timestamp, description: When the row was read into Provisa, visible_to: [org_admin]}
views:
- id: request_sql
  domain_id: shop
  description: Every statement the shop sent, with the request it served, its duration and the
    table it read or wrote
  sql: >-
    SELECT
      l.application_name AS request_id,
      CAST(NULLIF(SPLIT_PART(SPLIT_PART(l.message, 'duration: ', 2), ' ms', 1), '') AS DOUBLE PRECISION) AS duration_ms,
      SPLIT_PART(SPLIT_PART(l.message, 'statement: ', 2), ' /*', 1) AS statement,
      CASE
        WHEN LOWER(l.message) LIKE '%statement: insert into %'
          THEN SPLIT_PART(SPLIT_PART(LOWER(l.message), 'insert into ', 2), ' ', 1)
        WHEN LOWER(l.message) LIKE '%statement: update %'
          THEN SPLIT_PART(SPLIT_PART(LOWER(l.message), 'statement: update ', 2), ' ', 1)
        ELSE SPLIT_PART(SPLIT_PART(LOWER(l.message), ' from ', 2), ' ', 1)
      END AS table_name,
      l."timestamp" AS logged_at
    FROM "shop"."db_log" AS l
    WHERE l.message LIKE 'duration: %' AND l.message LIKE '%request_id=%'
  columns:
  - {name: request_id, data_type: varchar, description: The request the statement served, visible_to: [org_admin, analyst]}
  - {name: duration_ms, data_type: double, description: How long the statement ran, visible_to: [org_admin, analyst]}
  - {name: statement, data_type: varchar, description: The statement, without its comment, visible_to: [org_admin, analyst]}
  - {name: table_name, data_type: varchar, description: 'The table it read (FROM) or wrote (INSERT INTO, UPDATE)', visible_to: [org_admin, analyst]}
  - {name: logged_at, data_type: timestamp, description: When the database logged it, visible_to: [org_admin, analyst]}
- id: slowest_pages
  domain_id: shop
  description: Each request the shop served, slowest first, with how many statements it ran and how
    long they took; its statements are its request_sql
  sql: >-
    SELECT a.request_id, a.method, a.path, a.status, a.request_time * 1000 AS page_ms,
      COUNT(r.request_id) AS statements, CAST(SUM(r.duration_ms) AS DECIMAL(12, 3)) AS sql_ms, MAX(r.duration_ms) AS slowest_sql_ms
    FROM "shop"."access_log" AS a
    LEFT JOIN "shop"."view_request_sql" AS r ON r.request_id = a.request_id
    GROUP BY a.request_id, a.method, a.path, a.status, a.request_time
  columns:
  - {name: request_id, data_type: varchar, description: The request, visible_to: [org_admin, analyst]}
  - {name: method, data_type: varchar, description: The HTTP method, visible_to: [org_admin, analyst]}
  - {name: path, data_type: varchar, description: The path requested, visible_to: [org_admin, analyst]}
  - {name: status, data_type: integer, description: The HTTP status returned, visible_to: [org_admin, analyst]}
  - {name: page_ms, data_type: double, description: Milliseconds nginx took to answer, visible_to: [org_admin, analyst]}
  - {name: statements, data_type: bigint, description: Statements the request ran, visible_to: [org_admin, analyst]}
  - {name: sql_ms, data_type: decimal, description: Milliseconds its statements ran in all, visible_to: [org_admin, analyst]}
  - {name: slowest_sql_ms, data_type: double, description: Milliseconds its slowest statement ran, visible_to: [org_admin, analyst]}
- id: requests_with_db_errors
  domain_id: shop
  description: Requests whose statement failed in the database, with the error and the statement
  sql: >-
    SELECT a.request_id, a.method, a.path, a.status, a.customer_id, a."time" AS requested_at,
      e.state_code, e.message AS error, SPLIT_PART(e.statement, ' /*', 1) AS statement
    FROM "shop"."db_log" AS e
    JOIN "shop"."access_log" AS a
      ON a.request_id = e.application_name
    WHERE e.error_severity = 'ERROR'
  columns:
  - {name: request_id, data_type: varchar, description: The request, visible_to: [org_admin, analyst]}
  - {name: method, data_type: varchar, description: The HTTP method, visible_to: [org_admin, analyst]}
  - {name: path, data_type: varchar, description: The path requested, visible_to: [org_admin, analyst]}
  - {name: status, data_type: integer, description: The HTTP status returned, visible_to: [org_admin, analyst]}
  - {name: customer_id, data_type: integer, description: The signed-in customer, visible_to: [org_admin, analyst]}
  - {name: requested_at, data_type: timestamp, description: When the request was served, visible_to: [org_admin, analyst]}
  - {name: state_code, data_type: varchar, description: The error's SQLSTATE, visible_to: [org_admin, analyst]}
  - {name: error, data_type: varchar, description: The database's message, visible_to: [org_admin, analyst]}
  - {name: statement, data_type: varchar, description: The statement that failed, without its comment, visible_to: [org_admin, analyst]}
- id: customers_with_5xx
  domain_id: shop
  description: Customers who were served a server error, with how many and their orders so far
  sql: >-
    SELECT c.id AS customer_id, c.name, c.city, COUNT(*) AS server_errors, MAX(a."time") AS last_error_at,
      MAX(o.orders) AS orders
    FROM "shop"."customers" AS c
    JOIN "shop"."access_log" AS a ON a.customer_id = c.id
    LEFT JOIN (SELECT customer_id, COUNT(*) AS orders FROM "shop"."orders" GROUP BY customer_id) AS o
      ON o.customer_id = c.id
    WHERE a.status >= 500
    GROUP BY c.id, c.name, c.city
  columns:
  - {name: customer_id, data_type: integer, description: The customer, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The customer's name, visible_to: [org_admin, analyst]}
  - {name: city, data_type: varchar, description: Where the customer lives, visible_to: [org_admin, analyst]}
  - {name: server_errors, data_type: bigint, description: Server errors the customer was served, visible_to: [org_admin, analyst]}
  - {name: last_error_at, data_type: timestamp, description: When the last one was, visible_to: [org_admin, analyst]}
  - {name: orders, data_type: bigint, description: Orders the customer has placed, visible_to: [org_admin, analyst]}
- id: viewed_not_bought
  domain_id: shop
  description: Products customers looked at that no order has ever included
  sql: >-
    SELECT p.id AS product_id, p.name, p.category, p.price, v.views
    FROM "shop"."products" AS p
    JOIN (SELECT product_id, COUNT(*) AS views FROM "shop"."access_log"
          WHERE product_id IS NOT NULL AND status = 200 GROUP BY product_id) AS v
      ON v.product_id = p.id
    LEFT JOIN (SELECT DISTINCT product_id FROM "shop"."order_items") AS b
      ON b.product_id = p.id
    WHERE b.product_id IS NULL
  columns:
  - {name: product_id, data_type: integer, description: The product, visible_to: [org_admin, analyst]}
  - {name: name, data_type: varchar, description: The product's name, visible_to: [org_admin, analyst]}
  - {name: category, data_type: varchar, description: The product's category, visible_to: [org_admin, analyst]}
  - {name: price, data_type: decimal, description: The price in USD, visible_to: [org_admin, analyst]}
  - {name: views, data_type: bigint, description: Times its page was viewed, visible_to: [org_admin, analyst]}
- id: slow_statements_by_table
  domain_id: shop
  description: The shop's statements grouped by the table they read or wrote, slowest first
  sql: >-
    SELECT table_name, COUNT(*) AS statements, CAST(AVG(duration_ms) AS DECIMAL(12, 3)) AS avg_ms,
      CAST(PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY duration_ms) AS DECIMAL(12, 3)) AS p95_ms,
      MAX(duration_ms) AS max_ms
    FROM "shop"."view_request_sql"
    GROUP BY table_name
  columns:
  - {name: table_name, data_type: varchar, description: The table, visible_to: [org_admin, analyst]}
  - {name: statements, data_type: bigint, description: Statements that read or wrote it, visible_to: [org_admin, analyst]}
  - {name: avg_ms, data_type: decimal, description: Their average duration, visible_to: [org_admin, analyst]}
  - {name: p95_ms, data_type: decimal, description: 'Their 95th percentile duration (approximate on Trino)', visible_to: [org_admin, analyst]}
  - {name: max_ms, data_type: double, description: The longest, visible_to: [org_admin, analyst]}
relationships:
- {id: access-to-customer, alias: BY_CUSTOMER, cardinality: many-to-one, source_table_id: access_log, source_column: customer_id, target_table_id: customers, target_column: id}
- {id: access-to-product, alias: VIEWED_PRODUCT, cardinality: many-to-one, source_table_id: access_log, source_column: product_id, target_table_id: products, target_column: id}
- {id: access-to-order, alias: VIEWED_ORDER, cardinality: many-to-one, source_table_id: access_log, source_column: order_id, target_table_id: orders, target_column: id}
- {id: order-to-customer, alias: PLACED_BY, cardinality: many-to-one, source_table_id: orders, source_column: customer_id, target_table_id: customers, target_column: id}
- {id: item-to-order, alias: ON_ORDER, cardinality: many-to-one, source_table_id: order_items, source_column: order_id, target_table_id: orders, target_column: id}
- {id: item-to-product, alias: OF_PRODUCT, cardinality: many-to-one, source_table_id: order_items, source_column: product_id, target_table_id: products, target_column: id}
- {id: db-log-to-request, alias: LOGGED_FOR, cardinality: many-to-one, source_table_id: db_log, source_column: application_name, target_table_id: access_log, target_column: request_id}
- {id: sql-to-request, alias: SERVED, cardinality: many-to-one, source_table_id: view_request_sql, source_column: request_id, target_table_id: access_log, target_column: request_id}
- {id: page-to-sql, alias: RAN, cardinality: one-to-many, source_table_id: view_slowest_pages, source_column: request_id, target_table_id: view_request_sql, target_column: request_id}
- {id: error-to-request, alias: FAILED_IN, cardinality: many-to-one, source_table_id: view_requests_with_db_errors, source_column: request_id, target_table_id: access_log, target_column: request_id}
