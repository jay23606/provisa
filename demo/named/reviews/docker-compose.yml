#
# The named demo "reviews" (start-ui-install.sh --demo reviews; REQ-2030). This file is its one
# start point: `docker compose up -d` brings up an electronics shop's three stores and fills them.
#
#   mongodb        the catalog: products (specs nested) and star ratings (Provisa: products,
#                  ratings_by_product)
#   elasticsearch  the reviews customers write (Provisa: reviews, reviews_matching)
#   neo4j          customers and what they bought (Provisa: customers, purchases, bought_together)
#   seeder         writes the data once (seed.py), then exits
#
# Ports: 28617 MongoDB, 28692 Elasticsearch, 28674 Neo4j's HTTP API (28687 its Bolt); each can
# be moved by its variable.
x-demo-labels: &demo-labels
  com.provisa.demo: reviews
name: provisa-demo-reviews
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: document
    ports:
      - "${REVIEWS_MONGO_PORT:-28617}:27017"
    volumes:
      - reviews_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 60
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${REVIEWS_ES_PORT:-28692}:9200"
    volumes:
      - reviews_es:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
  neo4j:
    image: neo4j:5.19-community
    restart: unless-stopped
    labels:
      <<: *demo-labels
      com.provisa.demo.role: graph
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "${REVIEWS_NEO4J_HTTP_PORT:-28674}:7474"
      - "${REVIEWS_NEO4J_BOLT_PORT:-28687}:7687"
    volumes:
      - reviews_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  seeder:
    image: provisa-demo-reviews-seeder:1
    build:
      context: .
      dockerfile: Dockerfile.seeder
    restart: "no"
    labels:
      <<: *demo-labels
      com.provisa.demo.role: seeder
    environment:
      MONGO_URL: mongodb://mongodb:27017
      ES_URL: http://elasticsearch:9200
      NEO4J_URL: http://neo4j:7474
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ${PROVISA_NAMED_DEMO_DIR:-.}/data:/data-marker

volumes:
  reviews_mongo:
  reviews_es:
  reviews_neo4j:
