# One Postgres table of the test stack, for the prod / Test (synthetic) isolation scenario run on
# each engine that generates synthetic rows (REQ-1942, REQ-1529):
# tests/integration/test_synthetic_isolation_engines_e2e.py.
federation_engine: duckdb
auth:
  provider: none
  assignments_source: provisa
  default_assignments:
    - domain_id: '*'
      role_id: org_admin
naming:
  domain_prefix: false
  rules: []
cache:
  enabled: false
domains:
  - id: syniso
    description: Synthetic isolation
sources:
  - id: syniso-pg
    type: postgresql
    host: ${env:PG_HOST}
    port: ${env:PG_PORT}
    database: ${env:PG_DATABASE}
    username: ${env:PG_USER}
    password: ${env:PG_PASSWORD}
tables:
  - source_id: syniso-pg
    table: syn_orders
    schema: syn_iso_e2e
    domain_id: syniso
    columns:
      - name: id
        data_type: integer
        is_primary_key: true
        visible_to: [org_admin]
      - name: region
        data_type: varchar
        visible_to: [org_admin]
relationships: []
roles: []
