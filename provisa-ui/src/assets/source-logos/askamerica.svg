<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AskAmerica">
  <defs>
    <clipPath id="tile"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <!-- diagonally split tile: blue upper-left, red lower-right -->
  <g clip-path="url(#tile)">
    <polygon fill="#1a3a8a" points="0,0 100,0 0,100"/>
    <polygon fill="#d5322f" points="100,0 100,100 0,100"/>
  </g>
  <!-- white question-mark hook + white star -->
  <path d="M33 34 A17 17 0 1 1 61 46 C55 52 50 55 50 63" fill="none"
        stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <polygon fill="#ffffff"
    points="50,68 52.82,76.12 61.4,76.29 54.57,81.48 57.05,89.71 50,84.8 42.95,89.71 45.43,81.48 38.6,76.29 47.18,76.12"/>
</svg>
